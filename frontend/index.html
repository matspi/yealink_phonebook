<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonebook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📞 Phonebook</h1>
        </header>

        <main>
            <!-- Contact Form -->
            <section class="contact-form">
                <h2 id="form-title">Add New Contact</h2>
                <form id="contactForm">
                    <input type="hidden" id="contactId">

                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="phone1">Phone Number 1</label>
                        <input type="tel" id="phone1" name="phone1">
                    </div>

                    <div class="form-group">
                        <label for="phone2">Phone Number 2</label>
                        <input type="tel" id="phone2" name="phone2">
                    </div>

                    <div class="form-group">
                        <label for="phone3">Phone Number 3</label>
                        <input type="tel" id="phone3" name="phone3">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Add Contact</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Cancel</button>
                    </div>
                </form>
            </section>

            <!-- Contacts List -->
            <section class="contacts-list">
                <h2>Contacts</h2>
                <div id="loading" class="loading">Loading...</div>
                <div id="error" class="error" style="display: none;"></div>
                <table id="contactsTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone 1</th>
                            <th>Phone 2</th>
                            <th>Phone 3</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsBody">
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state" style="display: none;">
                    No contacts yet. Add your first contact above!
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
